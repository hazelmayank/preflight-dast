# Model routing. The small model is the default path; the large model is for escalation when a
# proposal's confidence is below `escalate_below_confidence` (live mode only; replay ignores tiers).
provider: recorded           # recorded | anthropic
recordings_dir: demo/recordings
models:
  small: claude-haiku-5-5
  large: claude-sonnet-5-5
escalate_below_confidence: 0.6   # also the threshold below which a human must confirm the item
max_tokens: 4000
