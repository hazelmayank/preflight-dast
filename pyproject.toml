[project]
name = "preflight"
version = "0.1.0"
description = "Agentic real-time DAST for a B2B travel platform (synthetic target only)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
include = ["preflight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["seeds"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"target/app.py" = ["B008", "E501"]  # FastAPI Depends() idiom; long one-line HTML
